name: Version bump check

# Fails the PR if any tier was modified without a version bump. Sources:
#   grammar / content / resolver / duel-sim / web / worker
#            the tier's package.json ".version" (cascade rules in
#            scripts/version_rules.py: a package change bumps everything
#            bundled on top of it)
#   schema   apps/api/migrations/  a NEW numbered .sql file
# Doc-only PRs are exempt. With the pre-commit hook installed
# (`pnpm install`) this never fires; it is the backstop.

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Verify patch bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the script can `git show base_ref:path`.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Version tooling unit tests
        run: python3 -m unittest discover -s scripts -v
      - name: Run version-bump check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py
